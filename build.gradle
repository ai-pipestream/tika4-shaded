import org.apache.tools.ant.filters.ReplaceTokens
import com.github.jengelman.gradle.plugins.shadow.transformers.ServiceFileTransformer

plugins {
    id 'java-library'
    id 'com.gradleup.shadow' version '9.6.1'
    id 'maven-publish'
    id 'pl.allegro.tech.build.axion-release' version '1.21.2'
    id 'signing'
    id 'com.gradleup.nmcp' version '1.6.1'
}


group = 'ai.pipestream'

// Configure axion-release plugin for semantic versioning
scmVersion {
    tag {
        prefix = 'v'
        initialVersion { config, position -> '0.7.0' }
    }
    checks {
        uncommittedChanges = false
        aheadOfRemote = false
        // Note: We must allow SNAPSHOT dependencies because Tika 4.0 is unreleased
        // But we verify that NO SNAPSHOTs are exposed to consumers (see POM validation)
        snapshotDependencies = false
    }
}

// Use scmVersion for releases, falls back to SNAPSHOT for development
version = scmVersion.version

def pipestreamBomVersion = findProperty('pipestreamBomVersion') ?: '0.7.0'

java {

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withJavadocJar()
    withSourcesJar()
    
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Ensure sourcesJar runs after generateBuildTime to avoid task dependency issues
tasks.named('sourcesJar') {
    mustRunAfter generateBuildTime
}

// The shadowJar uses archiveClassifier '' so it IS the published main artifact.
// Disable the default thin `jar` task so two tasks don't both write
// build/libs/<name>.jar — that shared output path makes Gradle's publish-task
// validation fail ("uses this output of task ':jar' without declaring a
// dependency") on publishToMavenLocal and the Central snapshot publish.
tasks.named('jar') {
    enabled = false
}

repositories {
    // Tika tracks the 4.0.0-SNAPSHOT nightly line, which only exists in the
    // Apache snapshots repository. The nightly CI build republishes the
    // shaded snapshot so consumers pick up Tika fixes as they land.
    mavenCentral()
    maven {
        url = uri("https://repository.apache.org/content/repositories/snapshots/")
        mavenContent {
            snapshotsOnly()
        }
    }
}

dependencies {
    implementation(libs.tika.core)
    implementation(libs.tika.parsers.standard)
    // Extended parsers for better content extraction
    implementation(libs.tika.parser.scientific)
    // OCR support for images and scanned documents (requires tesseract)
    // Note: OCR module is already included in tika-parsers-standard-package
    // Adding it explicitly here ensures it's available even if not using the full standard package
    implementation(libs.tika.parser.ocr)
    
    // Test dependencies
    testImplementation(libs.junit.jupiter)
    testImplementation(libs.assertj.core)
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

// Task to generate build-time.txt with current timestamp.
// Written under build/ (not src/) so builds never dirty the git tree; the
// directory is wired into the main resource set below, keeping the file on
// the runtime classpath.
tasks.register('generateBuildTime') {
    def buildTimeFile = layout.buildDirectory.file('generated-resources/build-time/build-time.txt')
    outputs.file(buildTimeFile)

    // Always run this task to ensure timestamp is current
    outputs.upToDateWhen { false }

    doLast {
        // Generate timestamp in ISO 8601 format (UTC) using Instant for precision
        def timestamp = java.time.Instant.now().toString()
        def outFile = buildTimeFile.get().asFile
        outFile.parentFile.mkdirs()
        outFile.text = timestamp + '\n'
        logger.lifecycle("Generated build-time.txt with timestamp: ${timestamp}")
    }
}

sourceSets.main.resources.srcDir(layout.buildDirectory.dir('generated-resources/build-time'))

// SINGLE SOURCE OF TRUTH for shading. Every entry here drives three things that
// must stay in lockstep, and used to be maintained by hand in three places:
//   1. the `relocate` calls in shadowJar (rewrites the bytecode),
//   2. the `exclude` of the dependencies' own META-INF/services files, and
//   3. the rewrite of service-file names and bodies in collectServiceFiles.
// Skip (2)/(3) for a package and the jar ships service registrations naming
// classes relocation just removed, which blows up in the consumer's
// ServiceLoader rather than here. Keep ShadedJarContentTest.relocations() in
// sync with this map.
ext.shadedRelocations = [
        // Tika itself: the whole point of the artifact.
        'org.apache.tika'    : 'ai.pipestream.shaded.tika',
        'com.google.protobuf': 'ai.pipestream.shaded.protobuf',
        'com.google.common'  : 'ai.pipestream.shaded.guava',
        // Apache HttpClient: consumers run their own (REST Assured / Quarkus);
        // an unrelocated copy on the classpath shadows theirs and breaks with
        // NoSuchMethodError (module-parser OpenApiEndpointIT, 2026-07-20).
        'org.apache.http'    : 'ai.pipestream.shaded.http',
        // commonmark: module-parser also depends on org.commonmark directly
        // (catalog version); keep the shaded copy private so the two never
        // shadow each other.
        'org.commonmark'     : 'ai.pipestream.shaded.commonmark',
        // Jackson: module-parser pulls quarkus-rest-jackson and Quarkus manages
        // its own Jackson version; an unrelocated copy here is the same
        // collision shape as the HttpClient one. ShadedJarParseTest proves
        // Tika's reflective Jackson use survives the rewrite.
        'com.fasterxml.jackson': 'ai.pipestream.shaded.jackson'
]

// Task to collect and merge the two class-name registries the dependency jars
// ship as plain text: META-INF/services/* (JDK ServiceLoader) and
// META-INF/tika/*.idx (Tika 4's generated component index). Neither is touched
// by shadow's bytecode relocation, and shadowJar's EXCLUDE duplicates strategy
// keeps only the first jar's copy of each name, so both have to be merged and
// rewritten here.
tasks.register('collectServiceFiles') {
    def outputDir = layout.buildDirectory.dir('service-files')
    outputs.dir(outputDir)

    // Get the resolved files at configuration time (compatible with config cache)
    def classpathFiles = configurations.runtimeClasspath.incoming.files
    def relocations = shadedRelocations
    inputs.property('relocations', relocations)

    doLast {
        def servicesDir = outputDir.get().asFile
        servicesDir.deleteDir()
        servicesDir.mkdirs()

        def serviceFiles = [:]
        def tikaIndexFiles = [:]

        def collectLines = { Map sink, String key, String content ->
            def lines = sink.computeIfAbsent(key) { new LinkedHashSet() }
            content.split('\n').each { line ->
                def trimmed = line.trim()
                if (trimmed && !trimmed.startsWith('#')) {
                    lines.add(trimmed)
                }
            }
        }

        // Iterate through all runtime classpath JARs
        classpathFiles.each { jar ->
            if (jar.name.endsWith('.jar')) {
                try {
                    def zipFile = new java.util.zip.ZipFile(jar)
                    zipFile.entries().each { entry ->
                        if (entry.isDirectory()) {
                            return
                        }
                        if (entry.name.startsWith('META-INF/services/')) {
                            collectLines(serviceFiles,
                                    entry.name.replace('META-INF/services/', ''),
                                    zipFile.getInputStream(entry).text)
                        } else if (entry.name.startsWith('META-INF/tika/') && entry.name.endsWith('.idx')) {
                            collectLines(tikaIndexFiles,
                                    entry.name.replace('META-INF/tika/', ''),
                                    zipFile.getInputStream(entry).text)
                        }
                    }
                    zipFile.close()
                } catch (Exception e) {
                    logger.warn("Failed to process JAR: ${jar.name}: ${e.message}")
                }
            }
        }

        // Write the merged service files with relocated package names
        def relocateName = { String name ->
            def result = name
            relocations.each { origin, target ->
                result = result.replace(origin + '.', target + '.')
            }
            return result
        }

        def asfHeader = """#  Licensed to the Apache Software Foundation (ASF) under one or more
#  contributor license agreements.  See the NOTICE file distributed with
#  this work for additional information regarding copyright ownership.
#  The ASF licenses this file to You under the Apache License, Version 2.0
#  (the "License"); you may not use this file except in compliance with
#  the License.  You may obtain a copy of the License at
#
#       http://www.apache.org/licenses/LICENSE-2.0
#
#  Unless required by applicable law or agreed to in writing, software
#  distributed under the License is distributed on an "AS IS" BASIS,
#  WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
#  See the License for the specific language governing permissions and
#  limitations under the License.

"""

        def writeMerged = { String relativePath, Collection lines ->
            def target = new File(servicesDir, relativePath)
            target.parentFile.mkdirs()
            target.text = asfHeader + lines.collect { relocateName(it as String) }.join('\n') + '\n'
            return target
        }

        serviceFiles.each { serviceName, implementations ->
            // Relocate the service file name for every shaded package
            def relocatedServiceName = relocateName(serviceName)
            writeMerged("META-INF/services/${relocatedServiceName}", implementations)
            logger.lifecycle("Created service file ${relocatedServiceName} with ${implementations.size()} implementations")
        }

        // Tika 4's annotation processor emits META-INF/tika/<kind>.idx registries whose
        // values are fully qualified class names. Shadow rewrites bytecode, not these
        // text files, so an unrewritten copy names classes the shaded jar no longer
        // contains. They are written with a `.idxmerged` staging suffix so the
        // shadowJar `exclude 'META-INF/tika/*.idx'` (which drops the dependencies'
        // unmerged originals) does not also drop these; shadowJar renames them back.
        tikaIndexFiles.each { indexName, entries ->
            writeMerged("META-INF/tika/${indexName}merged", entries)
            logger.lifecycle("Created Tika index ${indexName} with ${entries.size()} entries")
        }
    }
}

tasks {
    shadowJar {
        archiveClassifier.set('')

        // Depend on the service file collection task
        dependsOn collectServiceFiles

        // Include the merged and pre-relocated registries from our custom task.
        // The custom task already renamed the files and relocated the class names.
        from(layout.buildDirectory.dir('service-files')) {
            include 'META-INF/services/**'
            include 'META-INF/tika/**'
        }

        // Exclude the dependencies' own service files for every relocated package -
        // we ship the merged, pre-relocated copies from collectServiceFiles instead.
        // Without this the unrelocated originals win the duplicate race below and
        // the jar ships registrations naming classes that no longer exist.
        shadedRelocations.keySet().each { origin ->
            exclude "META-INF/services/${origin}.*"
        }

        // Same story for Tika 4's generated component index. The merged copies come
        // in as `*.idxmerged` (see collectServiceFiles) so this exclude only removes
        // the dependencies' originals; the rename below restores the real extension.
        exclude 'META-INF/tika/*.idx'
        filesMatching('META-INF/tika/*.idxmerged') {
            name = name.replace('.idxmerged', '.idx')
        }

        // Append other important resource files that need merging
        append 'META-INF/DEPENDENCIES'
        append 'META-INF/NOTICE'
        append 'META-INF/NOTICE.txt'
        append 'META-INF/LICENSE'
        append 'META-INF/LICENSE.txt'

        // Handle duplicate entries by excluding them
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE

        // Exclude signature files that commonly cause ZIP conflicts
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
        // Exclude maven metadata that causes duplicates
        exclude 'META-INF/maven/**/pom.properties'
        exclude 'META-INF/maven/**/pom.xml'

        // Allow large ZIP entries if needed
        zip64 true

        // Relocate packages to avoid conflicts. Rationale per package lives on the
        // shadedRelocations map above; add new entries there, not here.
        shadedRelocations.each { origin, target ->
            relocate origin, target
        }

        // Preserve important manifest entries
        manifest {
            attributes(
                'Implementation-Title': 'Tika 4 Shaded',
                'Implementation-Version': project.version,
                'Implementation-Vendor': 'ai.pipestream',
                'Built-By': System.getProperty('user.name'),
                'Built-JDK': System.getProperty('java.version'),
                'Created-By': "Gradle ${gradle.gradleVersion}"
            )
        }

        // Minimize the JAR by removing unused classes (optional, can be enabled if needed)
        // minimize()
    }

    build {
        dependsOn shadowJar
    }

}

// Ensure Java 21 compatibility for all JavaCompile tasks
tasks.withType(JavaCompile).configureEach {
    options.release = 21
}


// The interesting tests in this repo inspect and execute the PRODUCED shaded
// jar, not the compile classpath — the compile classpath still carries the
// unrelocated Tika, so a test written against it proves nothing about shading.
// Wire the artifact in explicitly: `test` declares the shadowJar archive as an
// input (which also carries the task dependency) and hands its path to the test
// JVM as a system property. The provider is captured in a local so the
// configuration cache never has to reach back to the task at execution time,
// and it is resolved in doFirst — by then shadowJar has run, so querying it is
// legal. The tests fail hard when the property is missing or the file is
// absent, so this can never degrade into a vacuous pass.
def shadedJarProvider = tasks.shadowJar.archiveFile

test {
    useJUnitPlatform()
    inputs.file(shadedJarProvider)
            .withPropertyName('shadedJar')
            .withPathSensitivity(PathSensitivity.NAME_ONLY)
    doFirst {
        systemProperty 'tika4shaded.jar', shadedJarProvider.get().asFile.absolutePath
    }
    // Tika + POI + PDFBox all load inside the isolated URLClassLoader used by
    // ShadedJarParseTest; the default 512m test heap is not enough.
    maxHeapSize = '1g'
}
compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

compileTestJava {
    options.encoding = 'UTF-8'
}

// Configure Javadoc task
tasks.withType(Javadoc).configureEach { task ->
    def opts = task.options
    opts.encoding = 'UTF-8'
    opts.charSet = 'UTF-8'
    opts.locale = 'en'
    // Suppress missing Javadoc warnings for now
    opts.addStringOption('Xdoclint:-missing', '-quiet')
    // Exclude internal packages
    task.exclude('**/internal/**', '**/impl/**', '**/test/**')
}

// Enable resource filtering to replace @version@ in application.properties
// Use @ delimiters to avoid conflicts with ${} runtime property placeholders
processResources {
    // Ensure build-time.txt is generated before processing resources
    dependsOn generateBuildTime
    
    filesMatching('**/*.properties') {
        filter(ReplaceTokens, tokens: [
                version: project.version.toString()
        ])
    }
}

processTestResources {
    filesMatching('**/*.properties') {
        filter(ReplaceTokens, tokens: [
                version: project.version.toString()
        ])
    }
}


publishing {
    publications {
        create('maven', MavenPublication) {
            artifact tasks.shadowJar
            // Include sources and javadoc jars
            artifact tasks.sourcesJar
            artifact tasks.javadocJar

            pom {
                name.set('Tika 4 Shaded')
                description.set('Shaded version of Apache Tika 4.0 snapshot with core, standard parsers, scientific parser, and OCR parser')
                url.set('https://github.com/ai-pipestream/tika4-shaded')

                licenses {
                    license {
                        name.set('MIT License')
                        url.set('https://opensource.org/licenses/MIT')
                    }
                }

                developers {
                    developer {
                        id.set('krickert')
                        name.set('Pipestream Engine Team')
                    }
                }

                scm {
                    connection.set('scm:git:git://github.com/ai-pipestream/tika4-shaded.git')
                    developerConnection.set('scm:git:ssh://github.com/ai-pipestream/tika4-shaded.git')
                    url.set('https://github.com/ai-pipestream/tika4-shaded')
                }

                // Ensure BOM/platform dependency is included in dependencyManagement
                // This ensures Maven Central can resolve dependency versions from the BOM
                withXml {
                    def projectNode = asNode()
                    def dependencyManagementNodes = projectNode.get('dependencyManagement')
                    def dmNode
                    def depsNode

                    if (dependencyManagementNodes.isEmpty()) {
                        // Create dependencyManagement and dependencies nodes
                        dmNode = projectNode.appendNode('dependencyManagement')
                        depsNode = dmNode.appendNode('dependencies')
                    } else {
                        // Get the first dependencyManagement node
                        dmNode = dependencyManagementNodes[0]
                        // Check if it has a dependencies child
                        def dependenciesNodes = dmNode.get('dependencies')
                        if (dependenciesNodes.isEmpty()) {
                            depsNode = dmNode.appendNode('dependencies')
                        } else {
                            depsNode = dependenciesNodes[0]
                        }
                    }

                    // Check if pipestream-bom already exists
                    def existingBom = depsNode.children().find { dep ->
                        dep.groupId?.text() == 'ai.pipestream' &&
                                dep.artifactId?.text() == 'pipestream-bom'
                    }

                    if (!existingBom) {
                        def bomDependency = depsNode.appendNode('dependency')
                        bomDependency.appendNode('groupId', 'ai.pipestream')
                        bomDependency.appendNode('artifactId', 'pipestream-bom')
                        bomDependency.appendNode('version', pipestreamBomVersion)
                        bomDependency.appendNode('type', 'pom')
                        bomDependency.appendNode('scope', 'import')
                    }
                }
            }
        }
    }

    repositories {
        // Publish to Maven Local for development
        mavenLocal()

        // Conditionally add GitHub Packages repository when credentials are available
        def ghRepo = System.getenv('GITHUB_REPOSITORY') ?: 'ai-pipestream/tika4-shaded'
        def ghActor = System.getenv('GITHUB_ACTOR') ?: (project.findProperty('gpr.user') ?: System.getenv('GPR_USER'))
        def ghToken = System.getenv('GITHUB_TOKEN') ?: (project.findProperty('gpr.key') ?: System.getenv('GPR_TOKEN'))
        if (ghActor && ghToken) {
            maven {
                name = 'GitHubPackages'
                url = uri("https://maven.pkg.github.com/${ghRepo}")
                credentials {
                    username = ghActor
                    password = ghToken
                }
            }
        }
    }
}


signing {
    // Read org-level GPG secrets directly, so runnable apps don't need extra env mapping
    def signingKey = System.getenv("GPG_PRIVATE_KEY")
    def signingPassword = System.getenv("GPG_PASSPHRASE")

    if (signingKey && signingPassword) {
        useInMemoryPgpKeys(signingKey, signingPassword)
        sign publishing.publications.maven
    }
}

// Ensure all signing tasks run before nmcp bundles and publishes artifacts
afterEvaluate {
    tasks.matching { it.name.startsWith("nmcpZipAllPublications") || it.name.startsWith("nmcpPublishAllPublicationsToCentralPortal") }
            .configureEach { nmcpTask ->
                nmcpTask.dependsOn(tasks.withType(Sign))
            }
}

nmcp {
    publishAllPublicationsToCentralPortal {
        username = providers.environmentVariable("MAVEN_CENTRAL_USERNAME")
        password = providers.environmentVariable("MAVEN_CENTRAL_PASSWORD")
        publishingType = "AUTOMATIC"
    }
}
